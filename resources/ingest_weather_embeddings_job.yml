# Scheduled re-sync of NWS alerts and forecasts, followed by embedding of any
# narrative that changed since the last run.
#
# Alerts are the reason this runs often: a warning issued at 14:10 is useless
# to a retrieval system that refreshes nightly. Every 30 minutes keeps active
# watches and warnings searchable while staying well inside the NWS guidance on
# request volume. Unchanged text is skipped by content hash, so a run with no
# new weather costs one API call per location and no embedding work at all.
#
# This job runs on serverless compute -- there is no job_clusters/new_cluster
# block, and the task has no cluster reference at all. That's deliberate, not
# an oversight: Databricks Free Edition is serverless-only, so a classic
# cluster spec here would simply fail to run. Serverless is also the right
# choice regardless of edition for a workload this size -- harvesting is
# network-bound and embedding a few thousand short chunks via a hosted
# endpoint takes seconds; there's nothing here that benefits from a
# provisioned cluster sitting idle between runs.
#
# Extra pip dependencies for a serverless task are declared under
# `environments` below and referenced by `environment_key` -- that's the
# serverless equivalent of the classic `libraries:` block on a task.
#
# The job's run-as identity needs CAN_QUERY on the databricks-gte-large-en
# serving endpoint, the same grant noted in app.yaml for the deployed App.

resources:
  jobs:
    ingest_weather_embeddings_job:
      name: "[${bundle.target}] Ingest weather narratives and embeddings"

      schedule:
        quartz_cron_expression: "0 0,30 * * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED   # flip to UNPAUSED after a successful manual run

      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      max_concurrent_runs: 1

      environments:
        - environment_key: weather_embeddings_env
          spec:
            client: "1"
            dependencies:
              # pg8000, not psycopg2: psycopg2's compiled C extension crashes
              # the kernel with a SIGABRT on serverless compute. pg8000 is
              # pure Python, so there's no compiled extension to conflict.
              - "pg8000>=1.31.2"
              - "requests>=2.32.3"
              - "pandas"
              # No sentence-transformers/torch: embeddings come from the
              # databricks-gte-large-en Model Serving endpoint over REST
              # (see notebooks/ingest_weather_embeddings.py), so nothing
              # heavy needs to load locally here either.

      tasks:
        - task_key: ingest_weather_embeddings
          environment_key: weather_embeddings_env
          notebook_task:
            notebook_path: ../notebooks/ingest_weather_embeddings.py
            base_parameters:
              documents_table: "weather_documents"
              embeddings_table: "weather_embeddings"
              embedding_model: "databricks-gte-large-en"
              locations: "Chicago, IL;Austin, TX;Denver, CO;Miami, FL;Seattle, WA"
              sync_limit: "50"
              chunk_size: "800"
              chunk_overlap: "100"
              nws_user_agent: "weather-intelligence-app (your.email@example.com)"
              skip_sync: "false"
